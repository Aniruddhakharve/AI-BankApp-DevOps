name: Docker Image Security Scan

on:
  workflow_call:

jobs:
    trivy-image-scan:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
              
            - name: login to Dockerhub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Pull Docker Image
              run: |
                docker pull ${{ secrets.DOCKER_USERNAME }}/bankapp:${{ github.sha }}   
                
            - name: Scan Image with Trivy
              uses: aquasecurity/trivy-action@0.35.0
              with:
                image-ref: ${{ secrets.DOCKER_USERNAME }}/bankapp:${{ github.sha }}
                format: 'table'
                severity: HIGH,CRITICAL   # Only report HIGH and CRITICAL vulnerabilities
                ignore-unfixed: true   # Ignore vulnerabilities that do not have a fix available
                exit-code: "1"  # Set exit code to 1 if vulnerabilities are found
                