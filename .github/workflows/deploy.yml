name: Deploy to EC2
on:
  workflow_call: 
jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH connection to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/bankapp:latest

            docker stop bankapp || true
            docker rm bankapp || true

            docker run -d \
              --name bankapp \
              -p 8081:8080 \
              -e MYSQL_HOST=bankapp-mysql \
              -e MYSQL_PORT=3306 \
              -e MYSQL_DATABASE=bankappdb \
              -e MYSQL_USER=root \
              -e MYSQL_PASSWORD=Test@123 \
              -e OLLAMA_URL=http://ollama:11434 \
              ${{ secrets.DOCKER_USERNAME }}/bankapp:latest