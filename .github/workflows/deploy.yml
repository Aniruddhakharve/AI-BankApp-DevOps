name: Deploy to EC2
on:
  workflow_call: null
jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH connection to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected successfully to EC2"
            docker --version
            hostname