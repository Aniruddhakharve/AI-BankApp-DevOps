---
name: BankApp CI Pipeline
on:
  push:
    branches:
      - docker
  workflow_dispatch: 
permissions:
  contents: read
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker image
        run: |
          docker build -f Dockerfile.multistage \
          -t ${{ secrets.DOCKER_USERNAME }}/bankapp:latest \
          -t ${{ secrets.DOCKER_USERNAME }}/bankapp:${{ github.sha }} \
          -t ${{ secrets.DOCKER_USERNAME }}/bankapp:${{ github.ref_name }} .
      - name: Push Docker image
        run: >
          docker push ${{secrets.DOCKER_USERNAME}}/bankapp:latest

          docker push ${{secrets.DOCKER_USERNAME}}/bankapp:${{ github.sha }}

          docker push ${{secrets.DOCKER_USERNAME}}/bankapp:${{ github.ref_name }}
  deploy:
    needs:
      - build-and-push
    uses: ./.github/workflows/deploy.yml
